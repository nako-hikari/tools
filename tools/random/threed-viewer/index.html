<script>
(function(root){
'use strict';
const PRIM={char:[1,'getInt8'],uchar:[1,'getUint8'],int8_t:[1,'getInt8'],uint8_t:[1,'getUint8'],short:[2,'getInt16'],ushort:[2,'getUint16'],int16_t:[2,'getInt16'],uint16_t:[2,'getUint16'],int:[4,'getInt32'],uint:[4,'getUint32'],int32_t:[4,'getInt32'],uint32_t:[4,'getUint32'],float:[4,'getFloat32'],double:[8,'getFloat64'],int64_t:[8,'getBigInt64'],uint64_t:[8,'getBigUint64'],long:[8,'getBigInt64'],ulong:[8,'getBigUint64']};

function decompress(u8){
  if(u8[0]===0x28&&u8[1]===0xb5&&u8[2]===0x2f&&u8[3]===0xfd){
    if(!root.fzstd)throw new Error('Zstd decoder is missing');

    if(!root.fflate)throw new Error('Gzip decoder is missing');
    return root.fflate.gunzipSync(u8);
  }
  return u8;
}

class Rec{
  constructor(P,def,off){this.P=P;this.def=def;this.off=off;}
  has(n){return n in this.def.f;}
  get(n,k){
    const f=this.def.f[n];
    if(!f)return undefined;
    const P=this.P;
    k=k||0;
    if(f.ptr)return P.ptr(this.off+f.off+k*P.ps);
    const pr=PRIM[f.type];
    if(!pr)return undefined;
    const v=P.dv[pr[1]](this.off+f.off+k*pr[0],true);
    return typeof v==='bigint'?Number(v):v;
  }
  first(names,k){
    for(const n of names)if(this.has(n))return this.get(n,k);
    return undefined;
  }
  has2(names){
    for(const n of names)if(this.has(n))return n;
    return null;
  }
  vec(n,len){
    const o=[];
    for(let i=0;i<len;i++)o.push(this.get(n,i));
    return o;
  }
  str(n){
    const f=this.def.f[n];
    if(!f)return '';
    const u=this.P.u8;
    let s='';
    for(let i=0;i<f.count;i++){
      const c=u[this.off+f.off+i];
      if(!c)break;
      s+=String.fromCharCode(c);
    }
    try{return decodeURIComponent(escape(s));}catch(e){return s;}
  }
  sub(n,k){
    const f=this.def.f[n];
    if(!f)return null;
    const sd=this.P.byName[f.type];
    if(!sd)return null;
    return new Rec(this.P,sd,this.off+f.off+(k||0)*sd.size);
  }
  deref(n){
    const v=this.get(n);
    return v?this.P.at(v):null;
  }
  list(n,next){
    const out=[];
    const lb=this.sub(n);
    if(!lb)return out;
    let p=lb.get('first');
    const seen=new Set();
    while(p&&!seen.has(p)){
      seen.add(p);
      const r=this.P.at(p);
      if(!r)break;
      out.push(r);
      p=r.get(next||'next');
    }
    return out;
  }
}

class Blend{
  constructor(u8){
    u8=decompress(u8);
    this.u8=u8;
    this.dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
    const head=String.fromCharCode.apply(null,u8.subarray(0,17));
    if(head.slice(0,7)!=='BLENDER')throw new Error('This is not a Blender file');
    let hl,bh,ver;
    const nm=/^BLENDER(\d\d)-(\d\d)v(\d{4})/.exec(head);
    if(nm){
      hl=parseInt(nm[1],10);
      this.ps=8;
      bh=32;
      this.big=true;
      ver=parseInt(nm[3],10);
    }else{
      hl=12;
      this.ps=head[7]==='-'?8:4;
      if(head[8]==='V')throw new Error('Big-endian .blend files are not supported');
      bh=this.ps===8?24:20;
      this.big=false;
      ver=parseInt(head.slice(9,12),10);
    }
    this.version=ver;
    this.blocks=[];
    this.map=new Map();
    let p=hl;
    const n=u8.length;
    while(p+bh<=n){
      let code,size,ptr,sdna,count;
      const dv=this.dv;
      code=String.fromCharCode(u8[p],u8[p+1],u8[p+2],u8[p+3]).replace(/\0+$/,'');
      if(this.big){
        sdna=dv.getUint32(p+4,true);
        ptr=dv.getBigUint64(p+8,true);
        size=Number(dv.getBigUint64(p+16,true));
        count=Number(dv.getBigUint64(p+24,true));
      }else{
        size=dv.getUint32(p+4,true);
        ptr=this.ps===8?dv.getBigUint64(p+8,true):BigInt(dv.getUint32(p+8,true));
        sdna=dv.getUint32(p+8+this.ps,true);
        count=dv.getUint32(p+12+this.ps,true);
      }
      const b={code,size,ptr,sdna,count,off:p+bh};
      if(code==='ENDB')break;
      this.blocks.push(b);
      if(ptr&&!this.map.has(ptr))this.map.set(ptr,b);
      p=b.off+size;
    }
    this.parseDNA();
  }
  ptr(o){
    return this.ps===8?this.dv.getBigUint64(o,true):BigInt(this.dv.getUint32(o,true));
  }
  parseDNA(){
    const b=this.blocks.find(x=>x.code==='DNA1');
    if(!b)throw new Error('The file has no DNA block');
    const u8=this.u8,dv=this.dv,base=b.off;
    let p=base;
    const al=()=>{p=base+(((p-base)+3)&~3);};
    const tag=()=>{const s=String.fromCharCode(u8[p],u8[p+1],u8[p+2],u8[p+3]);p+=4;return s;};
    const cstr=()=>{let s='';while(u8[p]){s+=String.fromCharCode(u8[p]);p++;}p++;return s;};
    if(tag()!=='SDNA')throw new Error('Bad DNA header');
    if(tag()!=='NAME')throw new Error('Bad DNA names');
    let n=dv.getInt32(p,true);p+=4;
    const names=[];
    for(let i=0;i<n;i++)names.push(cstr());
    al();
    if(tag()!=='TYPE')throw new Error('Bad DNA types');
    n=dv.getInt32(p,true);p+=4;
    const types=[];
    for(let i=0;i<n;i++)types.push(cstr());
    al();
    if(tag()!=='TLEN')throw new Error('Bad DNA lengths');
    const tlen=[];
    for(let i=0;i<types.length;i++){tlen.push(dv.getInt16(p,true));p+=2;}
    al();
    if(tag()!=='STRC')throw new Error('Bad DNA structs');
    n=dv.getInt32(p,true);p+=4;
    this.structs=[];
    this.byName={};
    const ps=this.ps;
    for(let i=0;i<n;i++){
      const t=dv.getInt16(p,true);
      const nf=dv.getInt16(p+2,true);
      p+=4;
      const def={name:types[t],size:tlen[t],f:{},order:[]};
      let off=0;
      for(let k=0;k<nf;k++){
        const ft=types[dv.getInt16(p,true)];
        const raw=names[dv.getInt16(p+2,true)];
        p+=4;
        const ptr=raw[0]==='*'||raw.indexOf('(*')>=0;
        let nm=raw;
        const fp=/\(\*([^)]*)\)/.exec(raw);
        if(fp)nm=fp[1];
        nm=nm.replace(/^\*+/,'');
        let count=1;
        const re=/\[(\d+)\]/g;

        while((m=re.exec(nm)))count*=parseInt(m[1],10);
        nm=nm.replace(/\[.*$/,'');
        let sz;
        if(ptr)sz=ps;
        else{
          const ti=types.indexOf(ft);
          sz=tlen[ti];
        }
        def.f[nm]={off,type:ft,ptr,count,size:sz};
        def.order.push(nm);
        off+=sz*count;
      }
      this.structs.push(def);
      this.byName[def.name]=def;
    }
  }
  at(ptr){
    const b=this.map.get(ptr);
    if(!b)return null;
    const d=this.structs[b.sdna];
    if(!d)return null;
    const r=new Rec(this,d,b.off);
    r.ptr=ptr;
    return r;
  }
  block(ptr){
    return ptr?this.map.get(ptr)||null:null;
  }
  recs(ptr){
    const b=this.map.get(ptr);
    if(!b)return [];
    const d=this.structs[b.sdna];
    if(!d||!d.size)return [];
    const n=Math.floor(b.size/d.size);
    const out=[];
    for(let i=0;i<n;i++)out.push(new Rec(this,d,b.off+i*d.size));

  }
  copy(b){
    return this.u8.buffer.slice(this.u8.byteOffset+b.off,this.u8.byteOffset+b.off+b.size);

    const b=this.block(ptr);
    if(!b)return 0n;
    return this.ptr(b.off+k*this.ps);
  }
  ofCode(code){
    return this.blocks.filter(b=>b.code===code).map(b=>this.at(b.ptr)).filter(Boolean);
  }

const DOM={point:0,edge:1,face:2,corner:3};
const CDNAMES=[['vdata','vert_data'],['edata','edge_data'],['pdata','face_data'],['ldata','corner_data']];

function cstr(P,ptr){
  const b=P.block(ptr);
  if(!b)return '';
  let s='';
  for(let i=0;i<b.size&&P.u8[b.off+i];i++)s+=String.fromCharCode(P.u8[b.off+i]);
  return s;
}

function attrList(P,me,dom){

        const b=d?P.block(d.get('data')):null;
        if(!b)continue;
        out.push({name:cstr(P,a.get('name')),single:a.get('storage_type')===1,block:b});
      }
    }
  }
  for(const nm of CDNAMES[dom]){
    if(!me.has(nm))continue;
    const cd=me.sub(nm);
    const n=cd.get('totlayer')||0;
    if(!n)continue;
    const ls=P.recs(cd.get('layers'));
    for(let i=0;i<n&&i<ls.length;i++){
      const l=ls[i];
      const b=P.block(l.get('data'));
      if(!b)continue;
      out.push({name:l.str('name'),type:l.get('type'),single:false,block:b});
    }
    break;
  }
  return out;
}

function attrFind(list,name){
  for(const a of list)if(a.name===name)return a;
  return null;
}

function attrBuf(P,a){
  return P.copy(a.block);
}

function readMesh(P,me,T){
  const nv=me.first(['totvert','verts_num'])||0;
  const nl=me.first(['totloop','corners_num'])||0;
  const nf=me.first(['totpoly','faces_num'])||0;
  if(!nv||!nf)return null;
  const av=attrList(P,me,DOM.point);
  const ac=attrList(P,me,DOM.corner);
  const af=attrList(P,me,DOM.face);
  let pos=null;
  const ap=attrFind(av,'position');
  if(ap)pos=new Float32Array(attrBuf(P,ap));
  else{
    const mvp=me.has('mvert')?me.get('mvert'):0n;
    const b=P.block(mvp);
    if(b){
      const d=P.structs[b.sdna];
      const co=d.f.co.off;
      pos=new Float32Array(nv*3);
      for(let i=0;i<nv;i++)for(let k=0;k<3;k++)pos[i*3+k]=P.dv.getFloat32(b.off+i*d.size+co+k*4,true);
    }
  }
  if(!pos||pos.length<nv*3)throw new Error('Mesh vertices could not be read');

  let cv=null;
  const acv=attrFind(ac,'.corner_vert');
  if(acv)cv=new Int32Array(attrBuf(P,acv));
  else{
    const mlp=me.has('mloop')?me.get('mloop'):0n;
    const b=P.block(mlp);
    if(b){
      const d=P.structs[b.sdna];
      const fo=d.f.v.off;
      cv=new Int32Array(nl);
      for(let i=0;i<nl;i++)cv[i]=P.dv.getInt32(b.off+i*d.size+fo,true);
    }
  }
  if(!cv||cv.length<nl)throw new Error('Mesh corners could not be read');

  let offs=null,fmat=null,smooth=null;
  const offName=me.has2(['face_offset_indices','poly_offset_indices']);
  if(offName&&me.get(offName))offs=P.i32(me.get(offName));
  const amat=attrFind(af,'material_index');
  if(amat&&!amat.single)fmat=new Int32Array(attrBuf(P,amat));
  const asharp=attrFind(af,'sharp_face');
  const legacyFaces=!offs;
  if(legacyFaces){
    const mpp=me.has('mpoly')?me.get('mpoly'):0n;
    const b=P.block(mpp);
    if(b){
      const d=P.structs[b.sdna];
      const fl=d.f.loopstart.off,ft=d.f.totloop.off,ff=d.f.flag.off;
      const fm=d.f.mat_nr?d.f.mat_nr.off:(d.f.mat_nr_legacy?d.f.mat_nr_legacy.off:-1);
      offs=new Int32Array(nf+1);
      fmat=new Int32Array(nf);
      smooth=new Uint8Array(nf);
      for(let i=0;i<nf;i++){
        const o=b.off+i*d.size;
        offs[i]=P.dv.getInt32(o+fl,true);
        offs[i+1]=offs[i]+P.dv.getInt32(o+ft,true);
        fmat[i]=fm>=0?P.dv.getInt16(o+fm,true):0;
        smooth[i]=P.dv.getUint8(o+ff)&1;
      }
    }
  }
  if(!offs){
    if(nl===nf*3){
      offs=new Int32Array(nf+1);
      for(let i=0;i<=nf;i++)offs[i]=i*3;
    }else throw new Error('Mesh faces could not be read');
  }
  if(!smooth){
    smooth=new Uint8Array(nf).fill(1);
    if(asharp){
      if(asharp.single){
        const v=P.u8[asharp.block.off]?0:1;
        smooth.fill(v);
      }else{
        const sb=P.u8arr(asharp.block.ptr);
        for(let i=0;i<nf&&i<sb.length;i++)smooth[i]=sb[i]?0:1;
      }
    }
  }
  if(amat&&amat.single){
    fmat=new Int32Array(nf).fill(P.dv.getInt32(amat.block.off,true));
  }

  let uv=null;
  const want=me.has('active_uv_map_attribute')?cstr(P,me.get('active_uv_map_attribute')):'';
  const cands=[];
  for(const a of ac){
    if(!a.name||a.name[0]==='.')continue;
    const per=a.block.size/Math.max(nl,1);
    if(a.single)continue;
    if(per===8||per===12){
      if(a.type!==undefined&&a.type!==49&&a.type!==16)continue;
      cands.push({a,per});
    }
  }
  const pick=cands.find(c=>c.a.name===want)||cands.find(c=>/uv/i.test(c.a.name))||cands[0];
  if(pick){
    const f=new Float32Array(attrBuf(P,pick.a));
    uv=new Float32Array(nl*2);
    const st=pick.per/4;
    for(let i=0;i<nl;i++){uv[i*2]=f[i*st];uv[i*2+1]=f[i*st+1];}
  }

  const fn=new Float32Array(nf*3);
  const vn=new Float32Array(nv*3);
  for(let f=0;f<nf;f++){
    const s=offs[f],e=offs[f+1];
    let nx=0,ny=0,nz=0;
    for(let i=s;i<e;i++){
      const a=cv[i]*3,b=cv[i+1<e?i+1:s]*3;
      const ax=pos[a],ay=pos[a+1],az=pos[a+2],bx=pos[b],by=pos[b+1],bz=pos[b+2];
      nx+=(ay-by)*(az+bz);
      ny+=(az-bz)*(ax+bx);
      nz+=(ax-bx)*(ay+by);
    }
    fn[f*3]=nx;fn[f*3+1]=ny;fn[f*3+2]=nz;
    if(smooth[f]){
      for(let i=s;i<e;i++){
        const v=cv[i]*3;
        vn[v]+=nx;vn[v+1]+=ny;vn[v+2]+=nz;
      }
    }
  }

  const slots=new Map();
  const tris=[];
  for(let f=0;f<nf;f++){
    const s=offs[f],n=offs[f+1]-s;
    if(n<3)continue;
    const slot=fmat?Math.max(0,fmat[f]):0;
    let t=slots.get(slot);
    if(!t){t={count:0,tris:[]};slots.set(slot,t);}
    if(n===3){t.tris.push(f,s,s+1,s+2);t.count++;}
    else if(n===4){t.tris.push(f,s,s+1,s+2,f,s,s+2,s+3);t.count+=2;}
    else{
      const nx=fn[f*3],ny=fn[f*3+1],nz=fn[f*3+2];
      const ax=Math.abs(nx),ay=Math.abs(ny),az=Math.abs(nz);
      const pts=[];
      for(let i=0;i<n;i++){
        const v=cv[s+i]*3;
        let x,y;
        if(az>=ax&&az>=ay){x=pos[v];y=pos[v+1];}
        else if(ax>=ay){x=pos[v+1];y=pos[v+2];}
        else{x=pos[v];y=pos[v+2];}
        pts.push(new T.Vector2(x,y));
      }
      let res=null;
      try{res=T.ShapeUtils.triangulateShape(pts,[]);}catch(e){res=null;}
      if(!res||res.length!==n-2){
        res=[];
        for(let i=1;i<n-1;i++)res.push([0,i,i+1]);
      }
      for(const r of res){
        t.tris.push(f,s+r[0],s+r[1],s+r[2]);
        t.count++;
      }
    }
  }

  const out=[];
  for(const [slot,t] of slots){
    const n=t.count*3;
    const gp=new Float32Array(n*3),gn=new Float32Array(n*3),gu=uv?new Float32Array(n*2):null;
    let k=0;
    for(let q=0;q<t.tris.length;q+=4){
      const f=t.tris[q];
      let a=t.tris[q+1],b=t.tris[q+2],c=t.tris[q+3];
      const va=cv[a]*3,vb=cv[b]*3,vc=cv[c]*3;
      const ux=pos[vb]-pos[va],uy=pos[vb+1]-pos[va+1],uz=pos[vb+2]-pos[va+2];
      const wx=pos[vc]-pos[va],wy=pos[vc+1]-pos[va+1],wz=pos[vc+2]-pos[va+2];
      const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx;
      if(cx*fn[f*3]+cy*fn[f*3+1]+cz*fn[f*3+2]<0){const x=b;b=c;c=x;}
      const fl=Math.hypot(fn[f*3],fn[f*3+1],fn[f*3+2])||1;
      const fx=fn[f*3]/fl,fy=fn[f*3+1]/fl,fz=fn[f*3+2]/fl;
      const corners=[a,b,c];
      for(let j=0;j<3;j++){
        const ci=corners[j];
        const v=cv[ci]*3;
        gp[k*3]=pos[v];gp[k*3+1]=pos[v+1];gp[k*3+2]=pos[v+2];
        let x=fx,y=fy,z=fz;
        if(smooth[f]){
          const l=Math.hypot(vn[v],vn[v+1],vn[v+2]);
          if(l>1e-12){x=vn[v]/l;y=vn[v+1]/l;z=vn[v+2]/l;}
        }
        gn[k*3]=x;gn[k*3+1]=y;gn[k*3+2]=z;
        if(gu){gu[k*2]=uv[ci*2];gu[k*2+1]=uv[ci*2+1];}
        k++;
      }
    }
    out.push({slot,pos:gp,nor:gn,uv:gu});
  }
  return out;
}

function eulerMatrix(T,ob){
  const sc=ob.has('scale')?'scale':'size';
  const dsc=ob.has('dscale')?'dscale':'dsize';
  const loc=ob.vec('loc',3),dl=ob.vec('dloc',3);
  const s=ob.vec(sc,3),ds=ob.has(dsc)?ob.vec(dsc,3):[1,1,1];
  const mode=ob.get('rotmode');
  const q=new T.Quaternion();
  if(mode>0){
    const r=ob.vec('rot',3),dr=ob.vec('drot',3);
    q.setFromEuler(new T.Euler(r[0]+dr[0],r[1]+dr[1],r[2]+dr[2],EULER[mode]||'ZYX'));
  }else if(mode===0){
    const w=ob.vec('quat',4);
    q.set(w[1],w[2],w[3],w[0]);
    if(q.lengthSq()===0)q.set(0,0,0,1);
    q.normalize();
  }else{
    const ax=ob.vec('rotAxis',3);
    const v=new T.Vector3(ax[0],ax[1],ax[2]);
    if(v.lengthSq()>0)q.setFromAxisAngle(v.normalize(),ob.get('rotAngle'));
  }
  const m=new T.Matrix4();
  m.compose(new T.Vector3(loc[0]+dl[0],loc[1]+dl[1],loc[2]+dl[2]),q,new T.Vector3(s[0]*ds[0],s[1]*ds[1],s[2]*ds[2]));
  return m;
}

function localMatrix(T,ob){
  const m=eulerMatrix(T,ob);
  if(ob.has('parentinv')&&ob.get('parent')){
    const pi=new T.Matrix4().fromArray(ob.vec('parentinv',16));
    m.premultiply(pi);
  }
  return m;
}

function bytesToDataUrl(u8,mime){
  let s='';
  const step=0x8000;
  for(let i=0;i<u8.length;i+=step)s+=String.fromCharCode.apply(null,u8.subarray(i,i+step));
  return 'data:'+mime+';base64,'+btoa(s);
}

function sniff(u8){
  if(u8[0]===0x89&&u8[1]===0x50)return 'image/png';
  if(u8[0]===0xff&&u8[1]===0xd8)return 'image/jpeg';
  if(u8[0]===0x52&&u8[1]===0x49&&u8[2]===0x46&&u8[3]===0x46)return 'image/webp';
  if(u8[0]===0x42&&u8[1]===0x4d)return 'image/bmp';
  if(u8[0]===0x47&&u8[1]===0x49&&u8[2]===0x46)return 'image/gif';
  return null;
}

function loadImg(url){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>res(null);
    im.src=url;
  });
}

class Ctx{
  constructor(P,T,opts){
    this.P=P;this.T=T;this.opts=opts||{};
    this.imgCache=new Map();
    this.texCache=new Map();
    this.matCache=new Map();
    this.missing=new Set();
  }
  async image(im){
    const key=im.ptr;
    if(this.imgCache.has(key))return this.imgCache.get(key);
    const pr=(async()=>{
      const P=this.P;
      let pf=im.has('packedfile')?im.deref('packedfile'):null;
      if(!pf&&im.has('packedfiles')){
        const l=im.list('packedfiles');
        if(l.length)pf=l[0].deref('packedfile');
      }
      let url=null;
      if(pf){
        const b=P.block(pf.get('data'));
        if(b){
          const sz=Math.min(pf.get('size')||b.size,b.size);
          const u8=P.u8.subarray(b.off,b.off+sz);
          const mime=sniff(u8);
          if(mime)url=bytesToDataUrl(u8,mime);
        }
      }
      let fp='';
      if(im.has('filepath'))fp=im.str('filepath');
      if(!fp&&im.has('name'))fp=im.str('name');
      if(!url&&fp&&this.opts.findImage){
        const base=fp.replace(/\\/g,'/').split('/').pop();
        url=this.opts.findImage(base);
        if(!url)this.missing.add(base);
      }
      if(!url)return null;
      return loadImg(url);
    })();
    this.imgCache.set(key,pr);
    return pr;
  }
  async texture(tr,usage){
    const T=this.T;
    const img=await this.image(tr.image);
    if(!img)return null;
    const key=[tr.image.ptr,usage,tr.channel,tr.invert?1:0].join('|');
    if(this.texCache.has(key))return this.texCache.get(key);
    let tex;
    const plain=tr.channel==='rgb'&&!tr.invert;
    if(plain){
      tex=new T.Texture(img);
    }else{
      const cv=document.createElement('canvas');
      cv.width=img.naturalWidth||img.width;
      cv.height=img.naturalHeight||img.height;
      const cx=cv.getContext('2d');
      cx.drawImage(img,0,0);
      const id=cx.getImageData(0,0,cv.width,cv.height);
      const d=id.data;
      const ch={r:0,g:1,b:2,a:3}[tr.channel];
      for(let i=0;i<d.length;i+=4){
        let v;
        if(ch===undefined){
          if(tr.invert){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
          continue;
        }
        v=d[i+ch];
        if(tr.invert)v=255-v;
        d[i]=d[i+1]=d[i+2]=v;
        d[i+3]=255;
      }
      cx.putImageData(id,0,0);
      tex=new T.CanvasTexture(cv);
    }
    tex.wrapS=tex.wrapT=T.RepeatWrapping;
    tex.anisotropy=8;
    if(usage==='color')tex.encoding=T.sRGBEncoding;
    tex.needsUpdate=true;
    this.texCache.set(key,tex);
    return tex;
  }
}

function sockValue(s){
  const d=s.deref('default_value');
  if(!d||!d.has('value'))return null;
  const n=d.def.f.value.count;
  return n>1?d.vec('value',n):d.get('value');
}

class Tree{
  constructor(P,tree){
    this.P=P;
    this.nodes=tree.list('nodes');
    this.linkTo=new Map();
    for(const l of tree.list('links')){
      const to=l.get('tosock');
      if(to)this.linkTo.set(to,l);
    }
  }
  inputs(node){
    const m={};
    const all=[];
    for(const s of node.list('inputs')){
      const k=s.str('name').toLowerCase();
      all.push(s);
      if(!m[k])m[k]=s;
    }
    m._all=all;
    return m;
  }
  idname(n){
    return n.str('idname')||n.str('name');
  }
  trace(sock,depth){
    depth=depth||0;
    if(!sock||depth>10)return null;
    const lk=this.linkTo.get(sock.ptr);
    if(!lk)return null;
    const node=this.P.at(lk.get('fromnode'));
    const fs=this.P.at(lk.get('fromsock'));
    if(!node)return null;
    const id=this.idname(node);
    const out=fs?fs.str('name').toLowerCase():'';
    const ins=this.inputs(node);
    if(id==='ShaderNodeTexImage'||id==='ShaderNodeTexEnvironment'){
      const im=node.deref('id');
      if(!im)return null;
      return {image:im,channel:out==='alpha'?'a':'rgb',invert:false,tint:null};
    }
    if(id==='ShaderNodeSeparateColor'||id==='ShaderNodeSeparateRGB'){
      const r=this.trace(ins.color||ins.image,depth+1);
      if(!r)return null;
      const map={red:'r',green:'g',blue:'b',r:'r',g:'g',b:'b'};
      const c=map[out];
      if(!c)return r;
      return Object.assign({},r,{channel:c});
    }
    if(id==='ShaderNodeInvert'){
      const r=this.trace(ins.color,depth+1);
      if(!r)return null;
      return Object.assign({},r,{invert:!r.invert});
    }
    if(id==='ShaderNodeMixRGB'||id==='ShaderNodeMix'){
      let a,b;
      if(id==='ShaderNodeMixRGB'){a=ins.color1;b=ins.color2;}
      else{
        const rgba=ins._all.filter(s=>s.get('type')===2);
        a=rgba[0];b=rgba[1];
      }
      let blend=id==='ShaderNodeMixRGB'?node.get('custom1'):0;
      if(id==='ShaderNodeMix'){
        const st=node.deref('storage');
        if(st&&st.has('blend_type'))blend=st.get('blend_type');
      }
      const ra=this.trace(a,depth+1);
      if(ra){
        const cb=b&&!this.linkTo.get(b.ptr)?sockValue(b):null;
        if(blend===2&&cb&&cb.length>=3)ra.tint=cb;
        return ra;
      }
      const rb=this.trace(b,depth+1);
      if(rb){
        const ca=a&&!this.linkTo.get(a.ptr)?sockValue(a):null;
        if(blend===2&&ca&&ca.length>=3)rb.tint=ca;
        return rb;
      }
      return null;
    }
    if(id==='ShaderNodeHueSaturation'||id==='ShaderNodeGamma'||id==='ShaderNodeBrightContrast'||id==='ShaderNodeRGBCurve'||id==='ShaderNodeValToRGB'){
      return this.trace(ins.color||ins.fac,depth+1);
    }
    return null;
  }
  surface(){
    let out=null;
    for(const n of this.nodes){
      if(this.idname(n)==='ShaderNodeOutputMaterial'){
        const s=this.inputs(n).surface;
        if(s&&this.linkTo.get(s.ptr)){out=n;break;}
        if(!out)out=n;
      }
    }
    let node=null;
    if(out){
      const s=this.inputs(out).surface;
      const lk=s&&this.linkTo.get(s.ptr);
      if(lk)node=this.P.at(lk.get('fromnode'));
    }
    for(let i=0;i<6&&node;i++){
      const id=this.idname(node);
      if(id!=='ShaderNodeMixShader'&&id!=='ShaderNodeAddShader')break;
      const sh=node.list('inputs').filter(s=>s.get('type')===3);
      let nx=null;
      for(const s of sh){
        const lk=this.linkTo.get(s.ptr);
        if(lk){
          const c=this.P.at(lk.get('fromnode'));
          if(c&&this.idname(c)!=='ShaderNodeBsdfTransparent'&&this.idname(c)!=='ShaderNodeEmission'){nx=c;break;}
          if(!nx)nx=c;
        }
      }
      node=nx;
    }
    if(!node)node=this.nodes.find(n=>this.idname(n)==='ShaderNodeBsdfPrincipled')||null;
    return node;
  }
}

async function buildMaterial(ctx,ma){
  const T=ctx.T,P=ctx.P;
  const m=new T.MeshStandardMaterial({side:T.DoubleSide});
  m.name=ma.sub('id').str('name').slice(2);
  m.color.setRGB(ma.get('r'),ma.get('g'),ma.get('b'));
  if(ma.has('roughness'))m.roughness=ma.get('roughness');
  if(ma.has('metallic'))m.metalness=ma.get('metallic');
  const treePtr=ma.has('nodetree')?ma.get('nodetree'):0n;
  const treeRec=treePtr?P.at(treePtr):null;
  if(!treeRec)return m;
  const tree=new Tree(P,treeRec);
  const node=tree.surface();
  if(!node)return m;
  const id=tree.idname(node);
  const ins=tree.inputs(node);
  const num=(s,d)=>{const v=s?sockValue(s):null;return typeof v==='number'?v:d;};
  const col=s=>{const v=s?sockValue(s):null;return v&&v.length>=3?v:null;};
  let baseS=null,roughS=null,metalS=null,alphaS=null,emS=null,emStr=null,normS=null;
  if(id==='ShaderNodeBsdfPrincipled'){
    baseS=ins['base color'];roughS=ins.roughness;metalS=ins.metallic;alphaS=ins.alpha;
    emS=ins['emission color']||ins.emission;emStr=ins['emission strength'];normS=ins.normal;
    m.roughness=num(roughS,0.5);
    m.metalness=num(metalS,0);
  }else if(id==='ShaderNodeBsdfDiffuse'){
    baseS=ins.color;roughS=ins.roughness;normS=ins.normal;
    m.roughness=1;m.metalness=0;
  }else if(id==='ShaderNodeBsdfGlossy'||id==='ShaderNodeBsdfAnisotropic'){
    baseS=ins.color;roughS=ins.roughness;normS=ins.normal;
    m.roughness=num(roughS,0.3);m.metalness=1;
  }else if(id==='ShaderNodeEmission'){
    emS=ins.color;emStr=ins.strength;
    m.color.setRGB(0,0,0);
  }else{
    return m;
  }
  if(baseS){
    const c=col(baseS);
    if(c)m.color.setRGB(c[0],c[1],c[2]);
    const tr=tree.trace(baseS);
    if(tr){
      const tex=await ctx.texture(tr.channel==='a'?Object.assign({},tr,{channel:'rgb'}):tr,'color');
      if(tex){
        m.map=tex;
        if(tr.tint)m.color.setRGB(tr.tint[0],tr.tint[1],tr.tint[2]);
        else m.color.setRGB(1,1,1);
      }
    }
  }

function selectObjects(P){

  if(mc){
    const seen=new Set();
    const walk=col=>{
      if(!col||seen.has(col.ptr))return;
      seen.add(col.ptr);
      const fl=col.has('flag')?col.get('flag'):0;
      if(fl&1)return;
      for(const co of col.list('gobject'))add(co.deref('ob'));
      for(const ch of col.list('children'))walk(ch.deref('collection'));

    const sl=sc.has('lay')?sc.get('lay'):0xffffffff;
    for(const b of sc.list('base')){

      add(b.deref('object'));

  return out;
}

async function parse(buf,opts){

    const obMats=n.ob.has('mat')?n.ob.get('mat'):0n;

async function renderPng(){
 if(busy)return null;busy=true;toast('Rendering...');await new Promise(r=>setTimeout(r,60));

function toggleTheme() {
    const root = document.documentElement;
    const btn = document.querySelector('.theme-toggle');
    const icon = document.getElementById('theme-icon');
    const goingLight = root.getAttribute('data-theme') !== 'light';
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 400);
    if (goingLight) {
        root.setAttribute('data-theme', 'light');
        icon.src = IC + 'sun.png';
        try { localStorage.setItem('nako-theme', 'light'); } catch (e) {}
    } else {
        root.removeAttribute('data-theme');
        icon.src = IC + 'moon.png';
        try { localStorage.setItem('nako-theme', 'dark'); } catch (e) {}
    }
}
(function() {
    try {
        if (localStorage.getItem('nako-theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').src = IC + 'sun.png';
        }
    } catch (e) {}
})();
function showModal(title, message, options) {
    options = options || {};
    document.getElementById('nakoModalTitle').textContent = title;
    document.getElementById('nakoModalBody').textContent = message;
    const footer = document.getElementById('nakoModalFooter');
    footer.innerHTML = '';
    if (options.onConfirm) {
        const cancel = document.createElement('button');
        cancel.className = 'secondary interactive';
        cancel.textContent = options.cancelText || 'Cancel';
        cancel.onclick = closeNakoModal;
        footer.appendChild(cancel);
        const confirmBtn = document.createElement('button');
        confirmBtn.className = options.danger ? 'danger interactive' : 'primary interactive';
        confirmBtn.textContent = options.confirmText || (options.danger ? 'Delete' : 'Confirm');
        confirmBtn.onclick = () => { closeNakoModal(); options.onConfirm(); };
        footer.appendChild(confirmBtn);
    } else {
        const ok = document.createElement('button');
        ok.className = 'secondary interactive';
        ok.textContent = 'OK';
        ok.onclick = closeNakoModal;
        footer.appendChild(ok);
    }
    document.getElementById('nakoModal').classList.add('open');
}
function closeNakoModal() {
    document.getElementById('nakoModal').classList.remove('open');
}
document.getElementById('nakoModal').addEventListener('click', e => {
    if (e.target.id === 'nakoModal') closeNakoModal();
